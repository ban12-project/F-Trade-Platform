allowBuilds:
  # Platform-specific packages are already resolved; dependency scripts stay blocked.
  '@swc/core': false
  cbor-extract: false
  esbuild: false

# Reviewed same-major patches at exact parent boundaries; see #498 and #821.
# Remove these when the selected upstream runtime pins equivalent patched versions.
overrides:
  'express@5.2.1>qs': 6.16.1
  # Same-major URI/IP parser fixes, verified at actual parent boundaries (#498).
  'ajv@8.20.0>fast-uri': 3.1.9
  'socks@2.8.9>ip-address': 10.7.4
  'express-rate-limit@8.7.0>ip-address': 10.7.4
  '@dotenvx/dotenvx@1.75.1>systeminformation': 5.33.16
  '@workflow/world-local@5.2.0>undici': 7.30.1
  '@workflow/world-vercel@5.3.0>undici': 7.30.1

  # Tooling-only parent pins, with loader and MCP compatibility checks; see #498.
  # esbuild's 0.x minor API change is checked at the actual legacy loader boundary.
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.25.12

  # Reviewed Zod 4 size-check patches; keep Zod 3 consumers on their own major (#702).
  '@remotion/media@4.0.520>zod': 4.6.7
  '@remotion/studio-protocol@4.0.520>zod': 4.6.7
  '@remotion/studio-server@4.0.520>zod': 4.6.7
  '@remotion/studio@4.0.520>zod': 4.6.7
  '@vercel/cli-auth@0.0.1>zod': 4.6.7
  '@vercel/cli-config@0.2.4>zod': 4.6.7
  '@workflow/cli@5.0.7>zod': 4.6.7
  '@workflow/core@5.3.0>zod': 4.6.7
  '@workflow/world-local@5.2.0>zod': 4.6.7
  '@workflow/world-vercel@5.3.0>zod': 4.6.7
  '@workflow/world@5.1.0>zod': 4.6.7

patchedDependencies:
  # Enforce the existing dependency-list limit before the embedded parser (#702).
  '@remotion/studio-protocol@4.0.520': patches/@remotion__studio-protocol@4.0.520.patch
  # Bound this installed dependency's parser and AST walks; standalone dlx is separate.
  # Keep #498 open until an upstream fix and the independent CLI are verified.
  braces@3.0.3: patches/braces@3.0.3.patch
  # Block __proto__ in both merge loops until upstream ships a verified fix (#498).
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  # Backport upstream optimization bounds without changing consumer majors (#498).
  minimatch@10.2.6: patches/minimatch@10.2.6.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
