  '@swc/core': false
  cbor-extract: false
  esbuild: false

# Reviewed same-major patches for Workflow's exact pins; see #498.
# Remove these when the selected upstream runtime pins equivalent patched versions.
overrides:
  '@workflow/core@4.8.8>devalue': 5.9.3
  '@workflow/world-local@4.4.1>undici': 7.29.1
  '@workflow/world-vercel@4.7.4>undici': 7.29.1

  # Tooling-only parent pins, with loader and MCP compatibility checks; see #498.
  # esbuild's 0.x minor API change is checked at the actual legacy loader boundary.
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.25.12
  'shadcn@4.19.1>@modelcontextprotocol/sdk': 1.31.0
