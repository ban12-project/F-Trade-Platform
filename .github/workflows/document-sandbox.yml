name: document-sandbox

on:
  pull_request:
    paths:
      - '.github/workflows/document-sandbox.yml'
      - 'ops/video-sandbox/Dockerfile'
      - 'scripts/markitdown_preprocess.py'
      - 'scripts/pdf_catalog_layout.py'
      - 'scripts/pdf_kit_ocr.py'
      - 'scripts/pdf_disc_table_ocr.py'
      - 'scripts/pdf_tesseract_ocr.py'
      - 'scripts/test-pdf-disc-table-ocr.py'
      - 'scripts/test-pdf-kit-ocr.py'
      - 'scripts/synthetic_pdf_fixture.py'
      - 'scripts/test-document-sandbox.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/document-sandbox.yml'
      - 'ops/video-sandbox/Dockerfile'
      - 'scripts/markitdown_preprocess.py'
      - 'scripts/pdf_catalog_layout.py'
      - 'scripts/pdf_kit_ocr.py'
      - 'scripts/pdf_disc_table_ocr.py'
      - 'scripts/pdf_tesseract_ocr.py'
      - 'scripts/test-pdf-disc-table-ocr.py'
      - 'scripts/test-pdf-kit-ocr.py'
      - 'scripts/synthetic_pdf_fixture.py'
      - 'scripts/test-document-sandbox.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-sandbox:
    runs-on: ubuntu-latest
    # Cold builds install the complete media runtime; slow signed package mirrors
    # can take more than 15 minutes before the offline smoke test starts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Stage required source files for image context
        run: |
          mkdir -p /tmp/document-image/scripts
          cp scripts/markitdown_preprocess.py scripts/pdf_catalog_layout.py scripts/pdf_kit_ocr.py scripts/pdf_disc_table_ocr.py scripts/pdf_tesseract_ocr.py /tmp/document-image/scripts/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the runtime with only required source files
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: /tmp/document-image
          file: ops/video-sandbox/Dockerfile
          load: true
          provenance: false
          tags: f-trade-document-smoke
          cache-from: type=gha,scope=document-sandbox
          cache-to: type=gha,scope=document-sandbox,mode=max
      - name: Verify the actual image without network access
        run: |
          mkdir -p /tmp/document-image-tests
          cp scripts/test-document-sandbox.py scripts/test-pdf-kit-ocr.py scripts/test-pdf-disc-table-ocr.py scripts/synthetic_pdf_fixture.py /tmp/document-image-tests/
          docker run --rm --network none -v /tmp/document-image-tests:/test:ro f-trade-document-smoke /opt/markitdown/bin/python3 /test/test-document-sandbox.py
          docker run --rm --network none -e PYTHONPATH=/opt/f-trade -v /tmp/document-image-tests:/test:ro f-trade-document-smoke /opt/markitdown/bin/python3 /test/test-pdf-kit-ocr.py --native-pdf
          docker run --rm --network none -e PYTHONPATH=/opt/f-trade -v /tmp/document-image-tests:/test:ro f-trade-document-smoke /opt/markitdown/bin/python3 /test/test-pdf-disc-table-ocr.py --local-ocr
