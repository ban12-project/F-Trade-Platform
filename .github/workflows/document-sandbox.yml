name: document-sandbox

on:
  pull_request:
    paths:
      - '.github/workflows/document-sandbox.yml'
      - 'ops/video-sandbox/Dockerfile'
      - 'scripts/markitdown_preprocess.py'
      - 'scripts/pdf_catalog_layout.py'
      - 'scripts/pdf_kit_ocr.py'
      - 'scripts/test-pdf-kit-ocr.py'
      - 'scripts/synthetic_pdf_fixture.py'
      - 'scripts/test-document-sandbox.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/document-sandbox.yml'
      - 'ops/video-sandbox/Dockerfile'
      - 'scripts/markitdown_preprocess.py'
      - 'scripts/pdf_catalog_layout.py'
      - 'scripts/pdf_kit_ocr.py'
      - 'scripts/test-pdf-kit-ocr.py'
      - 'scripts/synthetic_pdf_fixture.py'
      - 'scripts/test-document-sandbox.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-sandbox:
    runs-on: ubuntu-latest
    # Cold builds install the complete media runtime; slow signed package mirrors
    # can take more than 15 minutes before the offline smoke test starts.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build the runtime with only required source files
        run: |
          mkdir -p /tmp/document-image/scripts
          cp scripts/markitdown_preprocess.py scripts/pdf_catalog_layout.py scripts/pdf_kit_ocr.py /tmp/document-image/scripts/
          docker build -f ops/video-sandbox/Dockerfile -t f-trade-document-smoke /tmp/document-image
      - name: Verify the actual image without network access
        run: |
          mkdir -p /tmp/document-image-tests
          cp scripts/test-document-sandbox.py scripts/test-pdf-kit-ocr.py scripts/synthetic_pdf_fixture.py /tmp/document-image-tests/
          docker run --rm --network none -v /tmp/document-image-tests:/test:ro f-trade-document-smoke /opt/markitdown/bin/python3 /test/test-document-sandbox.py
          docker run --rm --network none -e PYTHONPATH=/opt/f-trade -v /tmp/document-image-tests:/test:ro f-trade-document-smoke /opt/markitdown/bin/python3 /test/test-pdf-kit-ocr.py --native-pdf
