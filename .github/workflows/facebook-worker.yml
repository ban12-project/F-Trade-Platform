name: Facebook worker validation

on:
  pull_request:
    paths:
      - "lib/social/**"
      - "lib/actions/facebook-*.ts"
      - "lib/db/facebook-runtime-schema.ts"
      - "app/api/social-worker/**"
      - "app/workspace/facebook/**"
      - "components/workspace/facebook-*.tsx"
      - "components/workspace/workspace-facebook-attention.tsx"
      - ".github/workflows/facebook-worker.yml"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Facebook change-set checks
        shell: bash
        run: |
          files=(
            app/api/social-worker/facebook/authorize/route.ts
            app/api/social-worker/facebook/interactive/route.ts
            app/api/social-worker/facebook/media/route.ts
            app/api/social-worker/facebook/proxy/route.ts
            app/workspace/facebook/page.tsx
            app/workspace/layout.tsx
            components/workspace/facebook-account-panel.tsx
            components/workspace/facebook-attention-notice.tsx
            components/workspace/facebook-media-panel.tsx
            components/workspace/workspace-facebook-attention.tsx
            lib/actions/facebook-account.ts
            lib/actions/facebook-media.ts
            lib/db/facebook-runtime-schema.ts
            lib/social/facebook-account-forms.ts
            lib/social/facebook-account-store.ts
            lib/social/facebook-interactive-protocol.ts
            lib/social/facebook-media-contract.ts
            lib/social/facebook-media-store.ts
            lib/social/facebook-proxy-protocol.ts
            lib/social/facebook-vault-crypto.ts
            lib/social/facebook-worker-protocol.ts
          )
          pnpm exec biome ci "${files[@]}"
      - name: Application typecheck
        run: pnpm typecheck
