name: Facebook worker validation

on:
  pull_request:
    paths:
      - "lib/social/**"
      - "app/api/social-worker/**"
      - "ops/social-worker/**"
      - ".github/workflows/facebook-worker.yml"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Application typecheck
        run: pnpm typecheck
