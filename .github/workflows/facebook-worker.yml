name: Facebook worker validation

on:
  pull_request:
    paths:
      - "lib/social/**"
      - "lib/actions/facebook-*.ts"
      - "lib/db/facebook-runtime-schema.ts"
      - "app/api/social-worker/**"
      - "app/workspace/facebook/**"
      - "components/workspace/facebook-*.tsx"
      - "components/workspace/workspace-facebook-attention.tsx"
      - ".github/workflows/facebook-worker.yml"

permissions:
  contents: write

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply fail-closed lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/social/facebook-account-store.ts")
          text = path.read_text()
          old = 'authState: event.operation === "verified" ? "ready" : event.state!'
          new = 'authState: event.operation === "verified" ? "ready" : event.state'
          if old in text:
              text = text.replace(
                  'if (event.operation === "attention" || event.operation === "verified") {',
                  'if (event.operation === "attention" || event.operation === "verified") {\n      if (event.operation === "attention" && !event.state) throw new Error("interactive_attention_state_missing");',
                  1,
              ).replace(old, new, 1)
              path.write_text(text)

          path = Path("lib/social/facebook-media-store.ts")
          text = path.read_text()
          text = text.replace(
              '!asset ||\n      asset.contentType !== "video/mp4" ||',
              'asset?.contentType !== "video/mp4" ||',
              1,
          )
          path.write_text(text)
          PY
      - name: Format Facebook change set
        shell: bash
        run: |
          files=(
            app/api/social-worker/facebook/authorize/route.ts
            app/api/social-worker/facebook/interactive/route.ts
            app/api/social-worker/facebook/media/route.ts
            app/api/social-worker/facebook/proxy/route.ts
            app/workspace/facebook/page.tsx
            app/workspace/layout.tsx
            components/workspace/facebook-account-panel.tsx
            components/workspace/facebook-attention-notice.tsx
            components/workspace/facebook-media-panel.tsx
            components/workspace/workspace-facebook-attention.tsx
            lib/actions/facebook-account.ts
            lib/actions/facebook-media.ts
            lib/db/facebook-runtime-schema.ts
            lib/social/facebook-account-forms.ts
            lib/social/facebook-account-store.ts
            lib/social/facebook-interactive-protocol.ts
            lib/social/facebook-media-contract.ts
            lib/social/facebook-media-store.ts
            lib/social/facebook-proxy-protocol.ts
            lib/social/facebook-vault-crypto.ts
            lib/social/facebook-worker-protocol.ts
          )
          pnpm exec biome check --write "${files[@]}"
          pnpm exec biome ci "${files[@]}"
      - name: Application typecheck
        run: pnpm typecheck
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/social-worker/facebook app/workspace/facebook app/workspace/layout.tsx components/workspace/facebook-*.tsx components/workspace/workspace-facebook-attention.tsx lib/actions/facebook-*.ts lib/db/facebook-runtime-schema.ts lib/social/facebook-*.ts
          git commit -m "style: format Facebook integration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
