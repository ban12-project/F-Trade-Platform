name: harbor-product-agent

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model identifier in provider/model format
        required: true
        type: string
      provider:
        description: Provider whose protected environment supplies the API key
        required: true
        type: choice
        options: [openai, anthropic, google, openai-compatible]

permissions:
  contents: read

jobs:
  evaluate:
    name: harbor-product-agent
    runs-on: ubuntu-latest
    environment: ${{ inputs.provider }}-product-agent-eval
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.22.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic Product Agent safety tests
        run: pnpm exec playwright test tests/e2e/product-agent.spec.ts
      - name: Set up Harbor
        uses: astral-sh/setup-uv@v6
      - name: Install Harbor
        run: uv tool install harbor
      - name: Build Product Agent evaluation image
        run: docker build -f evals/harbor/product-agent/Dockerfile -t f-trade-product-agent-eval:latest .
      - name: Prepare synthetic Harbor tasks
        run: pnpm eval:harbor:prepare
      - name: Run Product Agent evaluation
        env:
          HARBOR_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HARBOR_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARBOR_GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          HARBOR_OPENAI_COMPATIBLE_BASE_URL: ${{ vars.F_TRADE_OPENAI_COMPATIBLE_BASE_URL }}
          HARBOR_OPENAI_COMPATIBLE_API_KEY: ${{ secrets.F_TRADE_OPENAI_COMPATIBLE_API_KEY }}
          HARBOR_MODEL_INPUT: ${{ inputs.model }}
          HARBOR_PROVIDER_INPUT: ${{ inputs.provider }}
        run: |
          case "$HARBOR_MODEL_INPUT" in
            "$HARBOR_PROVIDER_INPUT"/*) ;;
            *)
              echo "Model provider must match the protected evaluation environment." >&2
              exit 1
              ;;
          esac
          case "$HARBOR_PROVIDER_INPUT" in
            openai)
              : "${HARBOR_OPENAI_API_KEY:?Missing protected OpenAI evaluation credential}"
              set -- --ae "HARBOR_OPENAI_API_KEY=$HARBOR_OPENAI_API_KEY"
              ;;
            anthropic)
              : "${HARBOR_ANTHROPIC_API_KEY:?Missing protected Anthropic evaluation credential}"
              set -- --ae "HARBOR_ANTHROPIC_API_KEY=$HARBOR_ANTHROPIC_API_KEY"
              ;;
            google)
              : "${HARBOR_GOOGLE_GENERATIVE_AI_API_KEY:?Missing protected Google evaluation credential}"
              set -- --ae "HARBOR_GOOGLE_GENERATIVE_AI_API_KEY=$HARBOR_GOOGLE_GENERATIVE_AI_API_KEY"
              ;;
            openai-compatible)
              : "${HARBOR_OPENAI_COMPATIBLE_BASE_URL:?Missing protected compatible endpoint}"
              : "${HARBOR_OPENAI_COMPATIBLE_API_KEY:?Missing protected compatible credential}"
              set -- \
                --ae "HARBOR_OPENAI_COMPATIBLE_BASE_URL=$HARBOR_OPENAI_COMPATIBLE_BASE_URL" \
                --ae "HARBOR_OPENAI_COMPATIBLE_API_KEY=$HARBOR_OPENAI_COMPATIBLE_API_KEY"
              ;;
          esac
          harbor run -p /tmp/f-trade-harbor-product-agent \
            -a evals.harbor.product_agent.f_trade_product_agent:FTradeProductAgent \
            -m "$HARBOR_MODEL_INPUT" -k 3 --yes \
            --ae "HARBOR_MODEL=$HARBOR_MODEL_INPUT" \
            "$@"
      - name: Validate and sanitize Harbor results
        if: ${{ !cancelled() }}
        env:
          HARBOR_MODEL: ${{ inputs.model }}
          HARBOR_PROVIDER: ${{ inputs.provider }}
        run: python scripts/validate-harbor-product-agent-results.py
      - name: Upload sanitized Harbor summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: harbor-product-agent-results
          path: harbor-artifacts/product-agent-summary.json
          retention-days: 30
