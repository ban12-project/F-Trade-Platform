name: repository-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validate:
    name: repository-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, imports, Next.js and React rules
        run: pnpm check:ci

      - name: Test Better Auth core and Passkey schema mappings
        run: pnpm exec tsx scripts/test-auth-schema.ts

      - name: Test workspace navigation and query concurrency
        run: pnpm test:workspace && pnpm test:workspace-navigation

      - name: Test Product Agent incremental validation
        run: pnpm test:product-stream

      - name: Test Product Agent evidence locations
        run: pnpm test:product-agent-evidence

      - name: Test catalog discovery and physical PDF page provenance
        run: pnpm exec tsx scripts/test-catalog-candidates.ts && pnpm test:catalog-preflight && pnpm test:local-ocr

      - name: Run synthetic Product Agent control ablation
        run: pnpm eval:product-safety-ablation

      - name: Test ProductMedia policies
        run: pnpm test:product-media && pnpm test:product-media-workflow

      - name: Install FFmpeg for rendered-media validation
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg poppler-utils tesseract-ocr

      - name: Inspect a real rendered video
        run: pnpm test:rendered-video-inspection

      - name: Test governed marketing-video captions
        run: pnpm test:marketing-video-edit && pnpm test:video-product-fact-runtime && pnpm test:video-visual-sampling && pnpm test:video-download-delivery

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test native PDF physical pages
        run: python scripts/test-local-ocr-preprocess.py --native-pdf --local-ocr && python scripts/test-pdf-catalog-layout.py --native-pdf

      - name: Test actual PDF catalog preflight
        run: node --import tsx scripts/test-pdf-catalog-preflight.ts

      - name: Validate contracts and repository hygiene
        run: python scripts/validate_repository.py
