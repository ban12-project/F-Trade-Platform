name: navigation-audit-snapshot

on:
  push:
    branches: [fix/263-workspace-navigation-biome]
    paths: [.github/workflows/navigation-audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated validation
        run: git archive --format=tar.gz --output=/tmp/f-trade-audit-source.tar.gz HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: navigation-audit-source
          path: /tmp/f-trade-audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
