name: navigation-audit-snapshot

on:
  push:
    branches: [fix/263-workspace-navigation-biome]
    paths: [.github/workflows/navigation-audit-snapshot.yml]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/fix/263-workspace-navigation-biome'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/263-workspace-navigation-biome
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Apply navigation refactor and safe formatting
        run: |
          mkdir -p /tmp/navigation-audit
          if test -f scripts/apply-navigation-migration.py; then
            python3 scripts/apply-navigation-migration.py > /tmp/navigation-audit/migration.log 2>&1
            rm scripts/apply-navigation-migration.py
          fi
          pnpm exec biome check --write --max-diagnostics=1000 . > /tmp/navigation-audit/biome.log 2>&1 || echo 'Diagnostics captured for review'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: persist workspace navigation shell and isolate stage reads (#263) [skip ci]'
            git push origin HEAD:fix/263-workspace-navigation-biome
          fi
          git archive --format=tar.gz --output=/tmp/navigation-audit/source.tar.gz HEAD
      - name: Capture typecheck and navigation regression results
        run: |
          pnpm typecheck > /tmp/navigation-audit/typecheck.log 2>&1 || echo 'Typecheck failed; see artifact'
          pnpm test:workspace-navigation > /tmp/navigation-audit/navigation-unit.log 2>&1 || echo 'Unit tests failed; see artifact'
          pnpm test:workspace >> /tmp/navigation-audit/navigation-unit.log 2>&1 || echo 'Workspace tests failed; see artifact'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate navigation with a production build
        run: pnpm exec playwright test tests/e2e/workspace-navigation.spec.ts tests/e2e/workspace-dashboard.spec.ts > /tmp/navigation-audit/e2e.log 2>&1 || echo 'Browser tests failed; see artifact'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: navigation-audit-refactor
          path: /tmp/navigation-audit/
          retention-days: 1
          if-no-files-found: error
