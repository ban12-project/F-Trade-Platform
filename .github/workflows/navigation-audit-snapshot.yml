name: navigation-audit-snapshot

on:
  push:
    branches: [fix/263-workspace-navigation-biome]
    paths: [.github/workflows/navigation-audit-snapshot.yml]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/fix/263-workspace-navigation-biome'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/263-workspace-navigation-biome
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Finalize pins and navigation regression corrections
        run: |
          python3 scripts/apply-navigation-migration.py
          rm scripts/apply-navigation-migration.py
          pnpm exec biome check --write .
          pnpm install --frozen-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: pin Biome, enforce deployment checks and refine navigation regressions (#263) [skip ci]'
            git push origin HEAD:fix/263-workspace-navigation-biome
          fi
      - name: Verify fast checks
        run: pnpm check:ci && pnpm typecheck && pnpm test:workspace-navigation
