name: passkey-schema-repair

on:
  push:
    branches: [fix/266-passkey-drizzle-schema]
    paths: [.github/workflows/passkey-schema-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/266-passkey-drizzle-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/266-passkey-drizzle-schema
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prove the regression test fails on the missing mapping
        run: |
          if pnpm exec tsx scripts/test-auth-schema.ts > /tmp/passkey-before.log 2>&1; then
            echo 'Expected the existing incomplete schema to fail' >&2
            exit 1
          fi
          cat /tmp/passkey-before.log
          grep -F 'authSchema must expose the actual Drizzle table for passkey' /tmp/passkey-before.log
      - name: Add only the missing model mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/db/schema.ts')
          text = path.read_text()
          old = 'export const authSchema = { user, session, account, verification };'
          new = 'export const authSchema = { user, session, account, verification, passkey };'
          assert text.count(old) == 1, 'Unexpected schema version: refusing to modify it'
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec biome check --write scripts/test-auth-schema.ts lib/db/schema.ts
      - name: Verify adapter regression and type checks
        run: pnpm exec tsx scripts/test-auth-schema.ts && pnpm typecheck && pnpm db:check
      - name: Commit the verified one-line mapping correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/db/schema.ts scripts/test-auth-schema.ts
          git diff --cached --stat
          git commit -m 'fix: expose passkey in Better Auth Drizzle schema (#266)'
          git push origin HEAD:fix/266-passkey-drizzle-schema
