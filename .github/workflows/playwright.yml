name: playwright

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: playwright-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checks
        run: pnpm typecheck

      - name: Check database migrations
        run: pnpm db:check

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --only-shell chromium

      - name: Offline browser login control ablations
        run: node scripts/browser-login-ablation.mjs
        env:
          REVIEW_REVISION: ${{ github.sha }}

      - name: Upload ablation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-login-ablation
          path: artifacts/browser-login-ablation/
          retention-days: 7

  ui:
    name: playwright-ui (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run production-build Playwright tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright UI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: playwright-database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: f_trade_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic -d f_trade_browser_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Verify authenticated browser writes against isolated PostgreSQL
        run: pnpm exec playwright test --config playwright.database.config.ts

      - name: Verify previous application readers accept newly created records
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ROLLBACK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKSPACE_ROLLBACK_TEST_DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/f_trade_browser_test
        run: |
          rollback_dir="$(mktemp -d)"
          git archive "$ROLLBACK_BASE_SHA" | tar -x -C "$rollback_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$rollback_dir/node_modules"
          cp scripts/test-workspace-rollback-readers.ts "$rollback_dir/scripts/"
          cd "$rollback_dir"
          node --conditions=react-server --import tsx scripts/test-workspace-rollback-readers.ts

      - name: Upload Playwright database report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-database-report
          path: blob-report-database/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: playwright-chromium
    needs: [checks, ui, database]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all Playwright jobs succeeded
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UI_RESULT: ${{ needs.ui.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          echo "checks=$CHECKS_RESULT ui=$UI_RESULT database=$DATABASE_RESULT"
          [[ "$CHECKS_RESULT" == "success" && "$UI_RESULT" == "success" && "$DATABASE_RESULT" == "success" ]]
